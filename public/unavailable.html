<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Site unavailable</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f1115;
      color: #e6e8eb;
      padding: 24px;
    }
    .card {
      max-width: 480px;
      text-align: center;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0 0 12px;
    }
    p {
      margin: 0;
      line-height: 1.6;
      color: #9aa0a6;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>This site is currently unavailable</h1>
    <p>The site has been temporarily taken offline. Please check back later.</p>
  </main>
</body>
</html>
